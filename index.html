<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aeroporto Inteligente - POO</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
      <h1>Painel de Partidas 🛫</h1>
    
    <div id="telaDoAeroporto"></div>

<div class="torre-controle" style="background: #ffffff; padding: 20px; margin-bottom: 20px;">
    <h2>Torre de Controle: Novo Despacho</h2>

        <form id="formDespacho">
        <input type="text" id="inputCodigo" placeholder="Código (Ex: G3-777)" required>
        <input type="text" id="inputDestino" placeholder="Destino (Ex: Tóquio)" required>
        <button type="submit" id="registrar">Registrar Voo</button>
    </form>
    <pre id="log"></pre>
</div>

  <button id="botaoAlerta">ALERTA</button>

    <h3 id="painelClima"></h3>    
    <div class="abastecer">
      <h2>Abastecimento do Voo</h2>
      <p id="painelCombustivel">Combustível: 100%</p>
      <button id="btnGastar">Gastar Combustível (Voar)</button>
      <button id="btnAbastecerSeguro">Abastecer 10%</button>
    </div>
  </div>



  <script type="module" src="JS/script.js"></script>
  <script type="module" src="JS/Clima.js"></script>
  <script type="module" src="JS/gate_contorol.js"></script>
  <script type="module" src="JS/dashboard.js"></script>
  <script type="module" src="JS/torre.js"></script>
</body>

</html>
